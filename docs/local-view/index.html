<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>medallion-10 iter-69 — local geometry view</title>
<style>
  :root { --line:#e2e6ec; --muted:#5a6473; --ink:#1d2330; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#0e1320; color:#e8edf5; }
  header { padding:16px 22px; border-bottom:1px solid #222b3d; }
  h1 { font-size:18px; margin:0; }
  .sub { color:#9aa6b8; font-size:13px; margin-top:4px; }
  .controls { padding:10px 22px; display:flex; gap:18px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #222b3d; }
  label { font-size:13px; color:#c2cbd9; display:flex; gap:6px; align-items:center; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:0; height:calc(100vh - 110px); }
  .pane { position:relative; overflow:hidden; border-right:1px solid #222b3d; background:#f4f6f9; }
  .pane:last-child { border-right:none; }
  .pane .tag { position:absolute; top:8px; left:8px; z-index:5; background:rgba(14,19,32,.82); color:#fff; font-size:12px; padding:3px 8px; border-radius:6px; }
  .stage { width:100%; height:100%; display:flex; align-items:center; justify-content:center; }
  .stage img, .stage object, .stage svg { max-width:100%; max-height:100%; transition:transform .08s; transform-origin:center; }
  .single .grid { grid-template-columns:1fr; }
</style>
</head>
<body>
<header>
  <h1>medallion-10 · iteration 69 (frozen) — live geometry</h1>
  <div class="sub">Rendered fresh from <code>iterations/69/pattern.bkr</code> via the bikar CLI · reference photo on the right · the white-lattice gap (render 34% white vs reference 55%) is what iter-70 targets</div>
</header>
<div class="controls">
  <label><input type="checkbox" id="solo"> reference only off — show render only</label>
  <label>zoom <input type="range" id="zoom" min="1" max="4" step="0.1" value="1"></label>
  <span class="sub" id="zlabel">1.0×</span>
</div>
<div class="grid" id="grid">
  <div class="pane">
    <div class="tag">OUR RENDER — iter-69 (.bkr geometry)</div>
    <div class="stage"><object id="svg" type="image/svg+xml" data="medallion-10-iter69.svg"></object></div>
  </div>
  <div class="pane" id="refpane">
    <div class="tag">REFERENCE PHOTO</div>
    <div class="stage"><img id="ref" src="reference.jpg" alt="reference"></div>
  </div>
</div>
<script>
const z=document.getElementById("zoom"), zl=document.getElementById("zlabel");
const svg=document.getElementById("svg"), ref=document.getElementById("ref");
z.oninput=()=>{ const v=z.value; zl.textContent=(+v).toFixed(1)+"×"; svg.style.transform="scale("+v+")"; ref.style.transform="scale("+v+")"; };
document.getElementById("solo").onchange=e=>{
  document.body.classList.toggle("single", e.target.checked);
  document.getElementById("refpane").style.display = e.target.checked ? "none" : "";
};
</script>
</body>
</html>
